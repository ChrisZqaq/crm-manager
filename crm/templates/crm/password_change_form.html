{% extends "crm/base.html" %}

{% block title %}修改密码 · 阿罗拉潮玩空间{% endblock %}

{% block content %}
  <header class="page-heading">
    <div>
      <h1>修改密码</h1>
      <p>请先验证当前密码，再设置新密码。</p>
    </div>
  </header>
  <section class="data-card">
    <form class="card-body" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button-primary" type="submit">保存新密码</button>
    </form>
  </section>
{% endblock %}
