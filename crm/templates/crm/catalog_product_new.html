{% extends 'crm/base.html' %}
{% load static %}
{% block title %}新建商品 · 阿罗拉潮玩空间{% endblock %}
{% block content %}
<section class="page-heading"><div><h1>新建商品</h1></div></section>
<form id="product-create" class="catalog-create-form">
  {% csrf_token %}
  <section class="data-card card-body catalog-create-section" aria-labelledby="product-fields-title">
    <h2 id="product-fields-title">商品资料</h2>
    <div class="form-grid">
      <label>IP<select name="brand_id" required><option value="">请选择</option>{% for brand in brands %}<option value="{{ brand.id }}">{{ brand.name }}</option>{% endfor %}</select></label>
      <label>商品类型<select name="type" required><option value="booster">补充包</option><option value="merchandise">周边</option><option value="gift_set">礼盒·预组</option></select></label>
      <label>产品名<input name="name" maxlength="255" required></label>
      <label>系列<input name="series" maxlength="120"></label>
      <label>语言版本<select name="language_id"><option value="">请选择</option>{% for language in languages %}<option value="{{ language.id }}">{{ language.name }}</option>{% endfor %}</select></label>
      <label>官方编号<input name="official_code" maxlength="100"></label>
    </div>
    <div class="catalog-aliases"><h3>商品别名</h3><div id="product-aliases"></div><button type="button" id="add-product-alias">添加别名</button></div>
      <details class="catalog-supplement">
        <summary>补充资料（选填）</summary>
        <div class="form-grid">
          <label>发售日期<input name="release_date" type="date"></label>
          <label class="catalog-notes-field">说明<textarea name="supplement_notes" maxlength="2000" rows="3"></textarea></label>
          {% if perms.crm.change_product %}<label>商品主图<input type="file" accept="image/jpeg,image/png,image/webp" data-catalog-image="product"></label>{% endif %}
        </div>
      </details>
  </section>
  <section class="data-card card-body catalog-create-section" aria-labelledby="sku-section-title">
    <div class="order-section-heading"><h2 id="sku-section-title">SKU规格</h2><button type="button" id="add-sku-row">添加SKU</button></div>
    <div id="sku-rows"></div>
  </section>
    <div class="catalog-create-actions"><button class="button-primary" id="save-product" type="submit">保存商品</button><button type="button" id="retry-catalog-images" hidden>重试未完成图片</button><p id="product-create-status" role="status" aria-live="polite"></p></div>
</form>
<script src="{% static 'crm/sku-number-suggestion.js' %}"></script>
<script>
  (()=>{
   const form=document.getElementById('product-create'),skuRows=document.getElementById('sku-rows'),aliases=document.getElementById('product-aliases'),status=document.getElementById('product-create-status'),retryImages=document.getElementById('retry-catalog-images');let key=CrmCrypto.uuidV4(),saving=false,createdProductId=null,created=false,hasUnsavedDraft=false,numberSuggestion=null,suggestionRequest=0;
 const csrf=()=>document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function api(url,method='GET',body){let response;try{response=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json','X-CSRFToken':csrf()}: {},body:body?JSON.stringify(body):undefined});}catch{throw new Error('网络请求失败，请检查网络后重试。');}let data=null;try{data=await response.json();}catch{}if(!response.ok){const error=new Error(data?.error?.message||`请求失败（HTTP ${response.status}），请重试。`);error.status=response.status;error.data=data;throw error;}if(!data||typeof data!=='object')throw new Error('服务器返回内容无法读取，请重试。');return data;}
 const catalogFieldLabels={brand_id:'IP',type:'商品类型',name:'产品名',series:'系列',language_id:'语言版本',official_code:'官方编号',release_date:'发售日期',supplement_notes:'说明'};
   function catalogFieldLabel(field){const sku=field.match(/^skus\[(\d+)\]\.(.+)$/);if(sku){const label={code:'SKU编号',unit:'单位',pack_type:'包装类型',barcode:'SKU条码',package_length_mm:'包装长度',package_width_mm:'包装宽度',package_height_mm:'包装高度',package_weight_g:'包装毛重'}[sku[2]]||'SKU资料';return `第 ${Number(sku[1])+1} 行${label}`;}return catalogFieldLabels[field]||'商品资料';}
 function showCatalogError(error){const fields=error.data?.error?.fields||{},messages=Object.entries(fields).map(([field,message])=>`${catalogFieldLabel(field)}：${message}`);status.setAttribute('role','alert');status.textContent=messages.join('；')||error.data?.error?.message||error.message||'商品保存失败，请重试。';}
 function addAlias(value=''){const row=document.createElement('div');row.className='inline-form-row';row.innerHTML='<label>别名<input data-alias maxlength="120"></label><button type="button" data-remove>删除</button>';row.querySelector('[data-alias]').value=value;row.querySelector('[data-remove]').onclick=()=>{row.remove();key=CrmCrypto.uuidV4();};aliases.append(row);key=CrmCrypto.uuidV4();}
   function nextSkuCode(code,prefix){const digits=[...code.slice(prefix.length)];let index=digits.length-1;while(index>=0&&digits[index]==='9')digits[index--]='0';if(index<0)digits.unshift('1');else digits[index]=String(Number(digits[index])+1);return prefix+digits.join('');}
   function showNumberSuggestion(row,hint){const input=row.querySelector('[data-code]'),text=row.querySelector('[data-suggestion]'),button=row.querySelector('[data-use-suggestion]');if(input.value.trim()){text.textContent=`已填写编号：${input.value.trim()}（建议不会覆盖）`;button.hidden=true;return;}text.textContent=`当前最大号：${hint.current_max_code||'暂无'}；下一号建议：${hint.suggested_code}（未预占）`;button.textContent='使用下一号建议';button.hidden=false;button.onclick=()=>{if(input.value.trim())return;input.value=hint.suggested_code;input.dispatchEvent(new Event('input',{bubbles:true}));};}
   function refreshNumberSuggestions(){if(!numberSuggestion)return;const used=new Set([...skuRows.querySelectorAll('[data-code]')].map(input=>input.value.trim()).filter(Boolean));for(const row of skuRows.children){const hint={...numberSuggestion};if(!row.querySelector('[data-code]').value.trim()){while(used.has(hint.suggested_code))hint.suggested_code=nextSkuCode(hint.suggested_code,hint.sku_prefix);used.add(hint.suggested_code);}showNumberSuggestion(row,hint);}}
   function updateSkuRows(){[...skuRows.children].forEach((row,index)=>{row.querySelector('[data-sku-title]').textContent=`SKU ${index+1}`;row.setAttribute('aria-label',`SKU ${index+1}`);row.querySelector('[data-remove-sku]').setAttribute('aria-label',`移除第 ${index+1} 个 SKU`);});refreshNumberSuggestions();}
   function addSku(){const row=document.createElement('div');row.className='catalog-sku-row';row.setAttribute('role','group');row.innerHTML='<div class="sku-row-heading"><h3 data-sku-title></h3><button type="button" data-remove-sku>移除SKU</button></div><div class="form-grid"><label>SKU编号<input data-code maxlength="80" required></label><label>单位<input data-unit maxlength="40" required></label><label>包装类型<select data-pack-type><option value="">不适用</option><option value="slim">瘦包</option><option value="fat">肥包</option><option value="empty">空</option></select></label><label>条码<input data-barcode maxlength="120"></label></div><p data-suggestion class="muted" aria-live="polite"></p><button type="button" data-use-suggestion hidden>使用下一号建议</button><div data-sku-aliases></div><button type="button" data-add-alias>添加SKU别名</button><label data-confirm-wrap hidden><input type="checkbox" data-confirm> 我已核对并确认重复条码</label><div data-candidates role="status"></div>';
    const supplement=document.createElement('details');supplement.className='catalog-supplement';supplement.innerHTML='<summary>补充资料（选填）</summary><div class="form-grid"><label>包装长度（mm）<input data-package-length type="number" min="0.001" max="9999999.999" step="0.001" inputmode="decimal"></label><label>包装宽度（mm）<input data-package-width type="number" min="0.001" max="9999999.999" step="0.001" inputmode="decimal"></label><label>包装高度（mm）<input data-package-height type="number" min="0.001" max="9999999.999" step="0.001" inputmode="decimal"></label><label>包装毛重（g）<input data-package-weight type="number" min="0.001" max="9999999.999" step="0.001" inputmode="decimal"></label></div>';
    {% if perms.crm.change_sku %}supplement.querySelector('.form-grid').insertAdjacentHTML('beforeend',`<label>包装图<input type="file" accept="image/jpeg,image/png,image/webp" data-catalog-image="sku"></label>`);{% endif %}
    row.append(supplement);row.querySelector('[data-add-alias]').onclick=()=>{const a=document.createElement('label');a.innerHTML='SKU别名 <input data-sku-alias maxlength="120">';row.querySelector('[data-sku-aliases]').append(a);key=CrmCrypto.uuidV4();};row.querySelector('[data-remove-sku]').onclick=()=>{if(skuRows.children.length>1){row.remove();key=CrmCrypto.uuidV4();updateSkuRows();}};skuRows.append(row);key=CrmCrypto.uuidV4();updateSkuRows();return row;}
   function payload(){const result={brand_id:form.elements.brand_id.value,type:form.elements.type.value,name:form.elements.name.value,series:form.elements.series.value,language_id:form.elements.language_id.value||null,official_code:form.elements.official_code.value,aliases:[...aliases.querySelectorAll('[data-alias]')].map(x=>x.value.trim()).filter(Boolean),operation_key:key,skus:[...skuRows.children].map(row=>{const sku={code:row.querySelector('[data-code]').value,unit:row.querySelector('[data-unit]').value,pack_type:row.querySelector('[data-pack-type]').value,barcode:row.querySelector('[data-barcode]').value,aliases:[...row.querySelectorAll('[data-sku-alias]')].map(x=>x.value.trim()).filter(Boolean),confirm_duplicate_barcode:row.querySelector('[data-confirm]').checked};for(const [field,selector] of [['package_length_mm','[data-package-length]'],['package_width_mm','[data-package-width]'],['package_height_mm','[data-package-height]'],['package_weight_g','[data-package-weight]']]){const value=row.querySelector(selector).value;if(value!=='')sku[field]=value;}return sku;})};const releaseDate=form.elements.release_date.value,notes=form.elements.supplement_notes.value;if(releaseDate)result.release_date=releaseDate;if(notes)result.supplement_notes=notes;return result;}
   form.addEventListener('input',event=>{if(!created){key=CrmCrypto.uuidV4();status.textContent='';hasUnsavedDraft=true;if(event.target.matches('[data-code]'))refreshNumberSuggestions();}});
   form.addEventListener('change',event=>{if(event.target.matches('[data-catalog-image]'))event.target.dataset.operationKey=CrmCrypto.uuidV4();if(!created)hasUnsavedDraft=true;});
   form.addEventListener('click',event=>{if(!created&&event.target.closest('#add-product-alias,#add-sku-row,[data-remove],[data-remove-sku],[data-add-alias],[data-use-suggestion]'))hasUnsavedDraft=true;});
   function selectedImages(productId,skuIds){const uploads=[],productImage=form.querySelector('[data-catalog-image="product"]');if(productImage?.files?.length)uploads.push({input:productImage,url:`/api/v1/products/${productId}/image`,label:'商品主图'});[...skuRows.children].forEach((row,index)=>{const input=row.querySelector('[data-catalog-image="sku"]');if(input?.files?.length)uploads.push({input,url:`/api/v1/skus/${skuIds[index]}/image`,label:`SKU ${index+1} 包装图`});});return uploads;}
   async function uploadImage({input,url}){const body=new FormData();body.append('file',input.files[0]);body.append('operation_key',input.dataset.operationKey||(input.dataset.operationKey=CrmCrypto.uuidV4()));let response;try{response=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body});}catch{throw new Error('网络请求失败，请检查网络后重试。');}let data=null;try{data=await response.json();}catch{}if(!response.ok)throw new Error(data?.error?.message||`上传失败（HTTP ${response.status}），请重试。`);input.value='';delete input.dataset.operationKey;}
   async function uploadPendingImages(productId,skuIds){const errors=[];for(const image of selectedImages(productId,skuIds)){try{await uploadImage(image);}catch(error){errors.push(`${image.label}：${error.message}`);}}return errors;}
   function finishCreatedForm(){for(const control of form.querySelectorAll('input,select,textarea,button'))if(control!==retryImages&&!control.matches('[data-catalog-image]'))control.disabled=true;}
   function openCreatedProduct(){location.href=`/catalog/?q=${encodeURIComponent(form.elements.name.value)}&sku_status=all&product_id=${encodeURIComponent(createdProductId)}`;}
   retryImages.addEventListener('click',async()=>{if(!created||saving)return;saving=true;retryImages.disabled=true;status.textContent='正在重试未完成的图片…';try{const errors=await uploadPendingImages(createdProductId,createdSkuIds);if(errors.length){status.setAttribute('role','alert');status.textContent=`商品已创建（ID ${createdProductId}），图片仍未完成：${errors.join('；')}`;return;}openCreatedProduct();}finally{saving=false;retryImages.disabled=false;}});
   window.addEventListener('beforeunload',event=>{const pendingImage=[...form.querySelectorAll('[data-catalog-image]')].some(input=>input.files?.length);if((!created&&hasUnsavedDraft)||(created&&pendingImage)){event.preventDefault();event.returnValue='';}});
   let createdSkuIds=[];
 form.elements.type.addEventListener('change',()=>{form.elements.language_id.required=form.elements.type.value==='booster'||form.elements.type.value==='gift_set';});form.elements.type.dispatchEvent(new Event('change'));
   async function loadNumberSuggestion(brand){const request=++suggestionRequest;numberSuggestion=null;for(const row of skuRows.children){row.querySelector('[data-suggestion]').textContent='';row.querySelector('[data-use-suggestion]').hidden=true;}if(!brand)return;try{const hint=await api(`/api/v1/skus/number-suggestion?brand_id=${encodeURIComponent(brand)}`);if(!CrmSkuNumberSuggestion.isValid(hint,true))throw new Error('服务器返回的编号建议无效，请重试。');if(request!==suggestionRequest||form.elements.brand_id.value!==brand)return;numberSuggestion=hint;refreshNumberSuggestions();}catch(error){if(request!==suggestionRequest||form.elements.brand_id.value!==brand)return;for(const row of skuRows.children){row.querySelector('[data-suggestion]').textContent=`编号建议加载失败：${error.message||'请重试。'}`;const button=row.querySelector('[data-use-suggestion]');button.textContent='重试编号建议';button.hidden=false;button.onclick=()=>loadNumberSuggestion(brand);}}}
   form.elements.brand_id.addEventListener('change',()=>loadNumberSuggestion(form.elements.brand_id.value));
 form.addEventListener('submit',async event=>{event.preventDefault();if(saving||created)return;saving=true;const button=document.getElementById('save-product');button.disabled=true;status.textContent='';try{const result=await api('/api/v1/products','POST',payload());createdProductId=String(result.product_id);createdSkuIds=result.sku_ids||[];created=true;hasUnsavedDraft=false;finishCreatedForm();const errors=await uploadPendingImages(createdProductId,createdSkuIds);if(errors.length){retryImages.hidden=false;status.setAttribute('role','alert');status.textContent=`商品已创建（ID ${createdProductId}），图片上传失败：${errors.join('；')}。可重试未完成的图片。`;return;}status.textContent='商品及图片已保存，正在打开商品目录…';openCreatedProduct();}catch(error){const fields=error.data?.error?.fields||{},details=error.data?.error?.details||{};showCatalogError(error);const candidates=details.candidates||[],field=Object.keys(fields).find(name=>/^skus\[\d+\]\.barcode$/.test(name)),index=field?Number(field.match(/\d+/)[0]):-1,row=skuRows.children[index];if(row&&candidates.length){const box=row.querySelector('[data-confirm-wrap]');box.hidden=false;const list=row.querySelector('[data-candidates]');list.replaceChildren();for(const item of candidates){const p=document.createElement('p');p.textContent=`${item.id===null?'本次表单前序SKU':item.code} · ${item.product||'商品资料'}${item.language?` · ${item.language}`:''} · ${item.unit}`;list.append(p);}}}finally{saving=false;button.disabled=created;}});
   document.getElementById('add-product-alias').onclick=()=>addAlias();document.getElementById('add-sku-row').onclick=addSku;addSku();
})();
</script>
{% endblock %}
