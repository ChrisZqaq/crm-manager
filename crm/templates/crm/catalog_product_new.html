{% extends 'crm/base.html' %}
{% block title %}新建商品 · 阿罗拉潮玩空间{% endblock %}
{% block content %}
<section class="page-heading"><div><h1>新建商品</h1><p>商品与首批SKU一次保存；编号候选仅供参考，不会自动占用。</p></div></section>
<form id="product-create" class="data-card card-body">
  {% csrf_token %}
  <div class="form-grid">
    <label>IP<select name="brand_id" required><option value="">请选择</option>{% for brand in brands %}<option value="{{ brand.id }}">{{ brand.name }}</option>{% endfor %}</select></label>
    <label>商品类型<select name="type" required><option value="booster">补充包</option><option value="merchandise">周边</option><option value="gift_set">礼盒·预组</option></select></label>
    <label>产品名<input name="name" maxlength="255" required></label>
    <label>系列<input name="series" maxlength="120"></label>
    <label>语言版本<select name="language_id"><option value="">不适用</option>{% for language in languages %}<option value="{{ language.id }}">{{ language.name }}</option>{% endfor %}</select></label>
    <label>官方编号<input name="official_code" maxlength="100"></label>
  </div>
  <fieldset><legend>产品别名</legend><div id="product-aliases"></div><button type="button" id="add-product-alias">添加别名</button></fieldset>
  <fieldset><legend>SKU</legend><p class="muted">条码重复时先核对候选记录，再明确勾选确认。</p><div id="sku-rows"></div><button type="button" id="add-sku-row">添加SKU</button></fieldset>
  <button class="button-primary" id="save-product" type="submit">保存商品</button>
  <p id="product-create-status" role="status" aria-live="polite"></p>
</form>
<script>
(()=>{
 const form=document.getElementById('product-create'),skuRows=document.getElementById('sku-rows'),aliases=document.getElementById('product-aliases'),status=document.getElementById('product-create-status');let key=crypto.randomUUID(),saving=false;
 const csrf=()=>document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function api(url,method='GET',body){const response=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json','X-CSRFToken':csrf()}: {},body:body?JSON.stringify(body):undefined}),data=await response.json();if(!response.ok){const error=new Error(data.error?.message||'请求失败。');error.status=response.status;error.data=data;throw error;}return data;}
 function addAlias(value=''){const row=document.createElement('div');row.className='inline-form-row';row.innerHTML='<label>别名<input data-alias maxlength="120"></label><button type="button" data-remove>删除</button>';row.querySelector('[data-alias]').value=value;row.querySelector('[data-remove]').onclick=()=>{row.remove();key=crypto.randomUUID();};aliases.append(row);key=crypto.randomUUID();}
 function addSku(){const row=document.createElement('fieldset');row.className='catalog-sku-row';row.innerHTML='<legend>规格</legend><div class="form-grid"><label>SKU编号<input data-code maxlength="80" required></label><label>单位<input data-unit maxlength="40" required></label><label>箱规格<input data-box></label><label>内盒规格<input data-inner></label><label>包规格<input data-pack></label><label>包装类型<select data-pack-type><option value="">不适用</option><option value="slim">瘦包</option><option value="fat">肥包</option><option value="empty">空</option></select></label><label>条码<input data-barcode maxlength="120"></label></div><p data-suggestion class="muted"></p><button type="button" data-use-suggestion hidden>使用候选编号</button><div data-sku-aliases></div><button type="button" data-add-alias>添加SKU别名</button><label data-confirm-wrap hidden><input type="checkbox" data-confirm> 我已核对并确认重复条码</label><div data-candidates role="status"></div><button type="button" data-remove-sku>移除此SKU</button>';row.querySelector('[data-add-alias]').onclick=()=>{const a=document.createElement('label');a.innerHTML='SKU别名 <input data-sku-alias maxlength="120">';row.querySelector('[data-sku-aliases]').append(a);key=crypto.randomUUID();};row.querySelector('[data-remove-sku]').onclick=()=>{if(skuRows.children.length>1){row.remove();key=crypto.randomUUID();}};skuRows.append(row);key=crypto.randomUUID();return row;}
 function payload(){return {brand_id:form.elements.brand_id.value,type:form.elements.type.value,name:form.elements.name.value,series:form.elements.series.value,language_id:form.elements.language_id.value||null,official_code:form.elements.official_code.value,aliases:[...aliases.querySelectorAll('[data-alias]')].map(x=>x.value.trim()).filter(Boolean),operation_key:key,skus:[...skuRows.children].map(row=>({code:row.querySelector('[data-code]').value,unit:row.querySelector('[data-unit]').value,box_spec:row.querySelector('[data-box]').value,inner_box_spec:row.querySelector('[data-inner]').value,pack_spec:row.querySelector('[data-pack]').value,pack_type:row.querySelector('[data-pack-type]').value,barcode:row.querySelector('[data-barcode]').value,aliases:[...row.querySelectorAll('[data-sku-alias]')].map(x=>x.value.trim()).filter(Boolean),confirm_duplicate_barcode:row.querySelector('[data-confirm]').checked}))};}
 form.addEventListener('input',()=>{key=crypto.randomUUID();status.textContent='';});
 form.elements.brand_id.addEventListener('change',async()=>{const brand=form.elements.brand_id.value;if(!brand)return;try{const hint=await api(`/api/v1/skus/number-suggestion?brand_id=${encodeURIComponent(brand)}`);for(const row of skuRows.children){row.querySelector('[data-suggestion]').textContent=`编号候选：${hint.suggested_code}（未占用）`;const button=row.querySelector('[data-use-suggestion]');button.hidden=false;button.onclick=()=>{row.querySelector('[data-code]').value=hint.suggested_code;key=crypto.randomUUID();};}}catch(error){status.textContent=error.message;}});
 form.addEventListener('submit',async event=>{event.preventDefault();if(saving)return;saving=true;const button=document.getElementById('save-product');button.disabled=true;status.textContent='';try{const data=await api('/api/v1/products','POST',payload());status.textContent='已保存，正在打开商品目录…';location.href=`/catalog/?q=${encodeURIComponent(form.elements.name.value)}&sku_status=all`;}catch(error){const fields=error.data?.error?.fields||{},details=error.data?.error?.details||{};status.setAttribute('role','alert');status.textContent=Object.entries(fields).map(([field,message])=>`${field}：${message}`).join('；')||error.message;const candidates=details.candidates||[],field=Object.keys(fields).find(name=>/^skus\[\d+\]\.barcode$/.test(name)),index=field?Number(field.match(/\d+/)[0]):-1,row=skuRows.children[index];if(row&&candidates.length){const box=row.querySelector('[data-confirm-wrap]');box.hidden=false;const list=row.querySelector('[data-candidates]');list.replaceChildren();for(const item of candidates){const p=document.createElement('p');p.textContent=`${item.id===null?'本次表单前序SKU':item.code} · ${item.product||'商品资料'}${item.language?` · ${item.language}`:''} · ${item.unit}`;list.append(p);}}}finally{saving=false;button.disabled=false;}});
 document.getElementById('add-product-alias').onclick=()=>addAlias();document.getElementById('add-sku-row').onclick=addSku;addSku();
})();
</script>
{% endblock %}
