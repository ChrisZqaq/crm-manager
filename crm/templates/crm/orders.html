{% extends 'crm/base.html' %}
{% load static %}
{% block title %}销售订单 · 阿罗拉潮玩空间{% endblock %}
{% block topbar_title %}销售订单{% endblock %}
{% block content %}
<section class="page-heading"><div><h1>销售订单</h1><p>日期按系统下单时点筛选；履约状态和收款核对状态分别显示。</p></div>{% if perms.crm.add_salesorder %}<a class="button-primary" href="{% url 'order-new' %}">新建订单</a>{% endif %}</section>
<form class="data-card filter-bar" id="order-filters" role="search">
  <div class="filter-field filter-search"><label for="order-query">订单编号、客户、渠道或销售</label><input id="order-query" name="q" type="search" value="{{ request.GET.q }}" maxlength="120"></div>
  <div class="filter-field"><label for="order-status">履约状态</label><select id="order-status" name="status"><option value="">全部</option>{% for value,label in status_options %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="filter-field"><label for="order-salesperson">销售ID</label><input id="order-salesperson" name="salesperson_id" type="number" min="1" step="1" inputmode="numeric" value="{{ request.GET.salesperson_id }}"></div>
  <div class="filter-field"><label for="order-warehouse">仓库ID</label><input id="order-warehouse" name="warehouse_id" type="number" min="1" step="1" inputmode="numeric" value="{{ request.GET.warehouse_id }}"></div>
  <div class="filter-field"><label for="order-start">下单日期起</label><input id="order-start" name="start_date" type="date" value="{{ request.GET.start_date }}"></div>
  <div class="filter-field"><label for="order-end">下单日期止</label><input id="order-end" name="end_date" type="date" value="{{ request.GET.end_date }}"></div>
  <div class="filter-field"><label for="order-verification">收款核对</label><select id="order-verification" name="verification_status"><option value="">全部</option><option value="pending" {% if request.GET.verification_status == 'pending' %}selected{% endif %}>待核对</option><option value="problem" {% if request.GET.verification_status == 'problem' %}selected{% endif %}>待处理</option><option value="passed" {% if request.GET.verification_status == 'passed' %}selected{% endif %}>核对通过</option></select></div>
  <button class="button-primary" type="submit">筛选</button><a class="button-link" href="{% url 'orders' %}">重置</a>
</form>
<p class="inline-status" id="order-status-message" role="status" aria-live="polite"></p>
<section class="data-card"><div class="table-scroll"><table><thead><tr><th>订单编号</th><th>客户</th><th>销售</th><th>出货仓</th><th class="numeric">订单金额</th><th>履约</th><th>收款核对</th><th>操作</th></tr></thead><tbody id="orders"><tr><td colspan="8" class="empty-state">正在加载订单…</td></tr></tbody></table></div>
<div class="pagination"><span id="order-page"></span><button id="order-previous" type="button">上一页</button><button id="order-next" type="button">下一页</button></div></section>
<script>
(() => {
  const form=document.getElementById('order-filters'), body=document.getElementById('orders'), message=document.getElementById('order-status-message');
  const controls=[...form.querySelectorAll('input,select')];
  const rowsFor=(data)=>{
    body.replaceChildren();
    if(!data.items.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=8;cell.className='empty-state';cell.textContent='没有匹配的订单。';row.append(cell);body.append(row);return;}
    for(const item of data.items){
      const row=document.createElement('tr'), warehouses=[...new Set((item.lines||[]).map(line=>line.warehouse).filter(Boolean))];
      const cells=[String(item.sequence),item.customer_name||'门店散客',item.salesperson,warehouses.join('、')||'—',`¥${item.revenue_amount}`,item.status_label,item.payment?.status_label||'未登记'];
      cells.forEach((value,index)=>{const cell=document.createElement('td');if(index===0){const link=document.createElement('a');link.href=`/orders/${encodeURIComponent(item.id)}/`;link.textContent=value;cell.append(link);}else{cell.textContent=value;if(index===5||index===6){const pill=document.createElement('span');const tone=index===5?(item.status==='completed'?'success':item.status==='ready_to_ship'?'info':item.status==='cancelled'?'neutral':'warning'):(!item.payment?'neutral':item.payment.status==='passed'?'success':item.payment.status==='problem'?'danger':'warning');pill.className=`status-pill status-pill--${tone}`;pill.textContent=value;cell.replaceChildren(pill);}}if(index===4)cell.classList.add('numeric');row.append(cell);});
      const action=document.createElement('td'), link=document.createElement('a');link.href=`/orders/${encodeURIComponent(item.id)}/`;link.textContent='查看';action.append(link);row.append(action);body.append(row);
    }
  };
  let page=Number(new URLSearchParams(location.search).get('page')||1), pageCount=1;
  async function load(){
    message.textContent='';body.setAttribute('aria-busy','true');
    const params=new URLSearchParams();for(const control of controls)if(control.value)params.set(control.name,control.value);params.set('page',String(page));params.set('page_size','50');
    try{
      const response=await fetch(`/api/v1/orders?${params}`,{credentials:'same-origin'}), data=await response.json();
      if(!response.ok)throw new Error(data.error?.message||'订单加载失败。');
      rowsFor(data);pageCount=Math.max(1,Math.ceil(data.total/data.page_size));document.getElementById('order-page').textContent=`共${data.total}单 · ${data.page}/${pageCount}`;
      document.getElementById('order-previous').disabled=data.page<=1;document.getElementById('order-next').disabled=data.page>=pageCount;
      const url=new URL(location.href);url.search=params.toString();history.replaceState(null,'',url);
    }catch(error){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=8;cell.className='error-row';cell.textContent='订单加载失败。';row.append(cell);body.replaceChildren(row);message.textContent=error.message;message.setAttribute('role','alert');}
    finally{body.removeAttribute('aria-busy');}
  }
  form.addEventListener('submit',event=>{event.preventDefault();page=1;load();});
  document.getElementById('order-previous').addEventListener('click',()=>{if(page>1){page--;load();}});
  document.getElementById('order-next').addEventListener('click',()=>{if(page<pageCount){page++;load();}});
  load();
})();
</script>
{% endblock %}
