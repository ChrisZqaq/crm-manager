{% extends 'crm/base.html' %}
{% load static %}
{% block title %}销售订单 · 阿罗拉潮玩空间{% endblock %}
{% block topbar_title %}销售订单{% endblock %}
{% block content %}
<section class="page-heading"><div><h1>销售订单</h1></div>{% if perms.crm.add_salesorder %}<a class="button-primary" href="{% url 'order-new' %}">新建订单</a>{% endif %}</section>
<div class="legacy-content">
  <div class="data-card filter-bar" aria-label="订单筛选">
    <div class="filter-field filter-search"><label for="query">客户、渠道或销售关键词</label><input id="query" type="search" maxlength="120" autocomplete="off"></div>
    <div class="filter-field"><label for="status-filter">履约状态</label><select id="status-filter"><option value="">全部</option>{% for value,label in status_options %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div>
    <div class="filter-field"><label for="order-number-filter">订单编号</label><input id="order-number-filter" disabled placeholder="接口待接入" aria-label="订单编号筛选接口待接入"></div>
    <div class="filter-field"><label for="sales-filter">销售</label><select id="sales-filter" disabled><option>筛选接口待接入</option></select></div>
    <div class="filter-field"><label for="warehouse-filter">仓库</label><select id="warehouse-filter" disabled><option>筛选接口待接入</option></select></div>
    <div class="filter-field"><label for="date-filter">订单日期</label><input id="date-filter" type="date" disabled aria-label="订单日期筛选接口待接入"></div>
    <div class="filter-field"><label for="payment-filter">收款核对</label><select id="payment-filter" disabled><option>筛选接口待接入</option></select></div>
  </div>
  <p id="status" role="status"></p>
  <section class="data-card"><div class="table-scroll"><table><thead><tr><th>订单编号</th><th>客户</th><th>销售</th><th>渠道</th><th>履约状态</th><th>收入</th><th>成本</th><th>毛利</th><th>提成预估</th></tr></thead><tbody id="orders"></tbody></table></div>
  <div class="pagination"><button id="previous" type="button">上一页</button><span id="page"></span><button id="next" type="button">下一页</button></div></section>
  <script>
    async function api(url){const response=await fetch(url,{credentials:'same-origin'});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'请求失败');return data;}
    const body=document.getElementById('orders'),message=document.getElementById('status'),query=document.getElementById('query'),filter=document.getElementById('status-filter');let page=1,pages=1;
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    async function load(){const params=new URLSearchParams({page:String(page),page_size:'50',q:query.value.trim()});if(filter.value)params.set('status',filter.value);try{const data=await api(`/api/v1/orders?${params}`);body.innerHTML=data.items.map(item=>`<tr><td><a href="/orders/${item.id}/">${item.sequence}</a></td><td>${esc(item.customer_name||'现场客户')}</td><td>${esc(item.salesperson)}</td><td>${esc(item.channel)}</td><td>${esc(item.status_label)}</td><td>${item.revenue_amount}</td><td>${item.cost_amount}</td><td>${item.margin_amount}</td><td>${esc(item.commission_estimate??'—')}</td></tr>`).join('')||'<tr><td colspan="9">暂无订单。</td></tr>';pages=Math.max(1,Math.ceil(data.total/data.page_size));document.getElementById('page').textContent=`${data.page} / ${pages}`;document.getElementById('previous').disabled=data.page<=1;document.getElementById('next').disabled=data.page>=pages;message.textContent='';}catch(error){message.textContent=error.message;}}
    query.addEventListener('input',()=>{page=1;load();});filter.addEventListener('change',()=>{page=1;load();});document.getElementById('previous').addEventListener('click',()=>{page=Math.max(1,page-1);load();});document.getElementById('next').addEventListener('click',()=>{page=Math.min(pages,page+1);load();});load();
  </script>
</div>
{% endblock %}
