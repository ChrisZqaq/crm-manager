<!doctype html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>销售订单 · CRM</title></head>
<body>
  <header>
    <h1>销售订单</h1>
    <nav><a href="{% url 'customers' %}">客户</a>{% if perms.crm.add_salesorder or request.user.is_superuser %} · <a href="{% url 'order-new' %}">新建订单</a>{% endif %}</nav>
  </header>
  <label>搜索 <input id="query" type="search" maxlength="120"></label>
  <label>状态 <select id="status-filter"><option value="">全部</option><option value="awaiting_payment">待付款凭证</option><option value="cancelled">已取消</option></select></label>
  <p id="status" role="status"></p>
  <table><thead><tr><th>序号</th><th>客户</th><th>销售</th><th>渠道</th><th>状态</th><th>收入</th><th>成本</th><th>毛利</th><th>提成预估</th></tr></thead><tbody id="orders"></tbody></table>
  <button id="previous" type="button">上一页</button><span id="page"></span><button id="next" type="button">下一页</button>
  <script>
    async function api(url){const response=await fetch(url,{credentials:'same-origin'});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'请求失败');return data;}
    const body=document.getElementById('orders'),message=document.getElementById('status'),query=document.getElementById('query'),filter=document.getElementById('status-filter');let page=1,pages=1;
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    async function load(){const params=new URLSearchParams({page:String(page),page_size:'50',q:query.value.trim()});if(filter.value)params.set('status',filter.value);try{const data=await api(`/api/v1/orders?${params}`);body.innerHTML=data.items.map(item=>`<tr><td><a href="/orders/${item.id}/">${item.sequence}</a></td><td>${esc(item.customer_name||'现场客户')}</td><td>${esc(item.salesperson)}</td><td>${esc(item.channel)}</td><td>${item.status==='cancelled'?'已取消':'待付款凭证'}</td><td>${item.revenue_amount}</td><td>${item.cost_amount}</td><td>${item.margin_amount}</td><td>${esc(item.commission_estimate??'—')}</td></tr>`).join('')||'<tr><td colspan="9">暂无订单。</td></tr>';pages=Math.max(1,Math.ceil(data.total/data.page_size));document.getElementById('page').textContent=`${data.page} / ${pages}`;document.getElementById('previous').disabled=data.page<=1;document.getElementById('next').disabled=data.page>=pages;message.textContent='';}catch(error){message.textContent=error.message;}}
    query.addEventListener('input',()=>{page=1;load();});filter.addEventListener('change',()=>{page=1;load();});document.getElementById('previous').addEventListener('click',()=>{page=Math.max(1,page-1);load();});document.getElementById('next').addEventListener('click',()=>{page=Math.min(pages,page+1);load();});load();
  </script>
</body>
</html>
