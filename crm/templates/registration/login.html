<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · CRM</title>
</head>
<body>
  <main>
    <h1>CRM 登录</h1>
    {% if form.errors %}<p role="alert">账号或密码不正确，或账号已停用。</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">账号</label>
      {{ form.username }}
      <label for="id_password">密码</label>
      {{ form.password }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
